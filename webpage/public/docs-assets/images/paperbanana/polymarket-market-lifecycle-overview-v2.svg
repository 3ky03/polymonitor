<svg xmlns="http://www.w3.org/2000/svg" width="1772" height="861" viewBox="0 0 1772 861" role="img" aria-labelledby="title desc">
  <title id="title">Polymarket market lifecycle overview</title>
  <desc id="desc">A publication-style infographic for polyMonitor showing data sources, lifecycle construction, and panel outputs.</desc>
  <defs>
    <linearGradient id="leftPanel" x1="14" y1="12" x2="314" y2="846" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#fff7d7"/>
    </linearGradient>
    <linearGradient id="centerPanel" x1="340" y1="18" x2="1410" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edfff6"/>
      <stop offset="0.42" stop-color="#effffa"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="1430" y1="18" x2="1760" y2="846" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3ff"/>
      <stop offset="1" stop-color="#fff8ff"/>
    </linearGradient>
    <linearGradient id="stageFill" x1="360" y1="120" x2="1050" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfff8" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#f7fffb" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="greenTitle" x1="550" y1="18" x2="1100" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d7a78"/>
      <stop offset="0.5" stop-color="#074b49"/>
      <stop offset="1" stop-color="#063b39"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eefbf5"/>
    </linearGradient>
    <linearGradient id="blueNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="goldNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8cd"/>
      <stop offset="1" stop-color="#ffd656"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
    <filter id="titleShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#001f1d" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L12 6.5 L1 12 Z" fill="#0c8a36"/>
    </marker>
    <marker id="arrowGray" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L12 6.5 L1 12 Z" fill="#8b9495"/>
    </marker>
    <style>
      .font { font-family: Inter, Arial, Helvetica, sans-serif; }
      .title { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 900; fill: #071013; }
      .top-title { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 900; fill: #ffffff; }
      .panel-title { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 900; fill: #081114; }
      .stage-title { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 900; fill: #003e1e; }
      .node-title { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 850; fill: #071013; }
      .small { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 750; fill: #071013; }
      .tiny { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 750; fill: #071013; }
      .micro { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 800; fill: #071013; }
      .source-card { fill: rgba(255,255,255,0.76); stroke: #b9b9b9; stroke-width: 2; filter: url(#cardShadow); }
      .node { fill: url(#nodeFill); stroke: #84b69f; stroke-width: 1.6; filter: url(#cardShadow); }
      .blue-node { fill: url(#blueNode); stroke: #438fe6; stroke-width: 1.6; filter: url(#cardShadow); }
      .stage { fill: url(#stageFill); stroke: #a8a8a8; stroke-width: 1.6; stroke-dasharray: 9 7; }
      .icon { fill: none; stroke: #050505; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon2 { fill: none; stroke: #050505; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #0c8a36; stroke-width: 4; marker-end: url(#arrowGreen); stroke-linecap: round; }
      .arrow-soft { fill: none; stroke: #0c8a36; stroke-width: 3.5; marker-end: url(#arrowGreen); stroke-linecap: round; }
      .arrow-gray { fill: none; stroke: #8b9495; stroke-width: 5; marker-end: url(#arrowGray); stroke-linecap: round; }
      .purple-arrow { fill: none; stroke: #9b50ba; stroke-width: 7; marker-end: url(#arrowGray); stroke-linecap: round; }
    </style>
  </defs>

